                options:
                  values:
                    - name: phone
                      label: Telefon
                    - name: reception
                      label: Recepcja
                    - name: online
                      label: Online
              - name: text
                label: Opis rezerwacji
                type: text
          - name: trainers
            label: Trenerzy
            type: select
            options:
              multiple: true
              values:
                - name: trainer-krzysztof
                  label: Krzysztof
                - name: trainer-cezary
                  label: Cezary
                - name: trainer-lukasz
                  label: Łukasz
                - name: trainer-rafal
                  label: Rafał
                - name: trainer-artur
                  label: Artur

  - name: uslugi
