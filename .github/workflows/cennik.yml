name: Cennik A4

on:
  push:
    branches: [main]
    paths:
      - "0-core/**"
      - "1-printables/**"
      - ".github/workflows/cennik.yml"
  pull_request:
    paths:
      - "0-core/**"
      - "1-printables/**"
      - ".github/workflows/cennik.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cennik-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 1-printables/package-lock.json

      - name: Instalacja zależności
        working-directory: 1-printables
        run: npm ci

      - name: Kontrola typów
        working-directory: 1-printables
        run: npm run check

      - name: Build cennika (HTML + PDF)
        working-directory: 1-printables
        run: npm run build

      - name: Sprawdzenie artefaktów
        working-directory: 1-printables
        run: |
          test -s 8-output/cennik-a4.html
          test -s 8-output/cennik-a4.pdf
          ls -lh 8-output/cennik-a4.html 8-output/cennik-a4.pdf

      - name: Publikacja artefaktu
        uses: actions/upload-artifact@v7
        with:
          name: cennik-a4
          path: |
            1-printables/8-output/cennik-a4.pdf
            1-printables/8-output/cennik-a4.html
          if-no-files-found: error
          retention-days: 30

      - name: Publikacja w GitHub Release
        if: github.ref == 'refs/heads/main'
        working-directory: 1-printables
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="cennik"
          TITLE="Cennik A4"
          NOTES="Cennik A4 z modelu 0-core — PDF (1 strona A4) i HTML. Build: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" --title "$TITLE" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" 8-output/cennik-a4.pdf 8-output/cennik-a4.html --clobber
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" -f sha="${GITHUB_SHA}" -F force=true
