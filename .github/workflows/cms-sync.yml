name: CMS sync

on:
  push:
    branches: [main]
    paths:
      - "0-content/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cms-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wygeneruj 0-core z 0-content
        run: node tools/cms/generate.mjs

      - name: Zacommituj wygenerowany model
        run: |
          if git diff --quiet -- 0-core; then
            echo "0-core już zsynchronizowane"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 0-core
          git commit -m "chore(cms): synchronizuj 0-core z 0-content"
          git push
